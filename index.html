<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ثبت و تحلیل مطالعه</title>
<style>
:root{--bg:#f3f4f9;--card:#fff;--text:#1c2030;--muted:#6b7285;--line:#e3e6ef;--accent:#4f6bed;--accent-soft:#e8ecfd;--good:#12a37a;--bad:#e5484d;--warn:#e08a00;--shadow:0 1px 3px rgba(20,25,50,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1120;--card:#181c2e;--text:#e9ecf6;--muted:#98a1ba;--line:#283050;--accent:#7b93ff;--accent-soft:#222b55;--good:#3ecf9f;--bad:#ff6b70;--warn:#f5b84a;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Vazirmatn,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:15px;line-height:1.7}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
h1{font-size:17px;margin:0}
nav{display:flex;gap:4px}
nav button{background:none;border:0;color:var(--muted);padding:8px 14px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
main{padding:16px 14px 60px;max-width:1000px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h2{font-size:16px;margin:0 0 12px}
.card h3{font-size:14px;margin:14px 0 8px;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
button.btn{font:inherit;border:0;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--accent);color:#fff;font-weight:700}
button.btn.ghost{background:var(--accent-soft);color:var(--accent)}
button.btn.red{background:var(--bad);color:#fff}
button.btn.sm{padding:4px 10px;font-size:13px;border-radius:9px}
button.btn.big{padding:12px 28px;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:1 1 150px}
.row.fit>*{flex:0 0 auto}
.row3{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
.timer{text-align:center}
.clock{font-size:56px;font-weight:800;letter-spacing:2px;margin:10px 0 2px;font-variant-numeric:tabular-nums;direction:ltr}
.timer .row{margin-bottom:8px}
.timer .btns{justify-content:center;margin-top:10px}
.timer .btns>*{flex:0 0 auto}
.status{color:var(--muted);font-size:14px;min-height:22px}
.prog{height:12px;background:var(--bg);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;background:var(--accent);border-radius:8px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:19px}
.kpi span{font-size:12.5px;color:var(--muted)}
.delta{font-size:12px;font-weight:700;margin-inline-start:4px}
.up{color:var(--good)}.down{color:var(--bad)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:6px;flex:0 0 auto}
.sess{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line)}
.sess:first-child{border-top:0}
.sess .body{flex:1;min-width:0}
.sess .meta{font-size:13px;color:var(--muted)}
.sess .act{display:flex;gap:4px;flex:0 0 auto}
.tag{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;background:var(--accent-soft);color:var(--accent);margin-inline-end:4px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:4px 12px;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chart{display:flex;align-items:flex-end;gap:3px;height:170px;padding-top:18px;position:relative;border-bottom:1px solid var(--line)}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0;position:relative}
.chart .bar{width:78%;max-width:36px;background:var(--accent);border-radius:5px 5px 0 0;min-height:0}
.chart .col.today .bar{background:var(--good)}
.chart .col.future .bar{background:var(--line)}
.chart .v{font-size:10.5px;color:var(--muted);white-space:nowrap}
.goal{position:absolute;left:0;right:0;border-top:2px dashed var(--warn);opacity:.7;pointer-events:none}
.lbls{display:flex;gap:3px;margin-top:4px}
.lbls div{flex:1;text-align:center;font-size:11px;color:var(--muted);min-width:0;overflow:hidden}
.hrow{display:grid;grid-template-columns:130px 1fr 150px;gap:10px;align-items:center;padding:6px 0}
.hbar{height:14px;background:var(--bg);border-radius:8px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:8px}
@media(max-width:600px){.hrow{grid-template-columns:90px 1fr 100px}.clock{font-size:44px}}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:right;color:var(--muted);font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line)}
.tblwrap{overflow-x:auto}
.good{color:var(--good);font-weight:700}.bad{color:var(--bad);font-weight:700}.mid{color:var(--warn);font-weight:700}
.ins{padding:9px 12px;border-radius:12px;margin-bottom:8px;font-size:14px;border-inline-start:4px solid var(--accent);background:var(--bg)}
.ins.good{border-color:var(--good);color:var(--text);font-weight:400}
.ins.bad{border-color:var(--bad);color:var(--text);font-weight:400}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;direction:rtl}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--bg);border:1px solid var(--line);min-width:12px}
.l1{background:#c7d2fe!important}.l2{background:#93a5fb!important}.l3{background:#5f7af0!important}.l4{background:#3a52d4!important}.l5{background:#12a37a!important}
.overlay{position:fixed;inset:0;background:rgba(10,12,25,.55);display:none;align-items:flex-start;justify-content:center;padding:20px 12px;overflow-y:auto;z-index:20}
.overlay.on{display:flex}
.modal{background:var(--card);border-radius:18px;padding:18px;width:100%;max-width:520px;margin:auto}
.modal h2{margin:0 0 6px;font-size:17px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:12px;z-index:30;display:none;max-width:90%;font-size:14px}
.banner{background:var(--accent-soft);color:var(--accent);padding:10px 14px;border-radius:12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:18px 0}
.dayhead{display:flex;justify-content:space-between;gap:8px;font-weight:700;margin:16px 0 4px;flex-wrap:wrap}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--bg);border:1px solid var(--line);display:inline-block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.two .card{margin-bottom:0}
@media(max-width:700px){.two{grid-template-columns:1fr}}
.ex .clock{font-size:44px}
.tin{width:84px;text-align:center;padding:6px}
.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.exgap{height:14px}
nav{overflow-x:auto;max-width:100%}
nav button{white-space:nowrap}
.alertbar{position:fixed;top:0;left:0;right:0;z-index:40;background:var(--warn);color:#1a1300;padding:14px 16px;display:none;align-items:center;justify-content:center;gap:14px;font-weight:700;flex-wrap:wrap}
.alertbar.on{display:flex}
.cd{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cd b{font-size:26px}
.task{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:20px;height:20px;padding:0;flex:0 0 auto;margin-top:4px;accent-color:var(--good)}
.task .body{flex:1;min-width:0}
.task .act{display:flex;gap:4px;flex:0 0 auto}
.task.done .ttl{text-decoration:line-through;opacity:.65}
.mini{height:7px;background:var(--card);border-radius:6px;overflow:hidden;border:1px solid var(--line);margin-top:4px}
.mini i{display:block;height:100%;background:var(--accent)}
.mini i.full{background:var(--good)}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.daycard{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.daycard.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.daycard h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.chk{display:flex;gap:8px;flex-wrap:wrap}
.chk label{display:flex;gap:6px;align-items:center;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px 10px;cursor:pointer;color:var(--text);margin:0}
.chk input{width:auto;padding:0}
.mst{padding:10px 0;border-top:1px solid var(--line)}
.mst:first-child{border-top:0}
.badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:12px;margin-inline-end:4px;background:var(--bg);border:1px solid var(--line)}
.badge.wrong{color:var(--bad)}
.badge.blank{color:var(--warn)}
.ic{font-size:15px;margin-inline-end:4px}
.exsub{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:8px}
.exsub-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.exin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.exin label{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.exin input{text-align:center;padding:8px 4px}
.subcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.subcards .exsub{margin-bottom:0}
.kvs{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:6px}
.kvs div{display:flex;flex-direction:column;font-size:14px}
.kvs span{color:var(--muted);font-size:12px}
@media(max-width:700px){
header nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding:4px 2px calc(4px + env(safe-area-inset-bottom));z-index:6;gap:0;justify-content:space-around;overflow:visible}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;font-size:11px;border-radius:8px}
nav button .ic{font-size:18px;margin:0}
main{padding-bottom:88px}
.toast{bottom:80px}
}
.lbrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.lbrow:first-child{border-top:0}.lbrow.me{background:var(--accent-soft);border-radius:10px;padding-inline:8px}
.lbrank{font-size:20px;text-align:center}
.lbbar{height:6px;background:var(--bg);border-radius:4px;margin-top:5px;overflow:hidden}.lbbar i{display:block;height:100%;background:var(--accent)}
@media(max-width:420px){header nav button{font-size:10px;padding:5px 0}}

.daycard{background:color-mix(in srgb,var(--dc,#888) 8%,var(--card));border-color:color-mix(in srgb,var(--dc,#888) 35%,var(--line))}
.daycard.today{border-color:var(--dc);box-shadow:0 0 0 2px var(--dc)}
.daycard h4{background:var(--dc);color:#fff;margin:-10px -12px 8px;padding:7px 12px;border-radius:13px 13px 0 0}
.daycard h4 .btn{background:rgba(255,255,255,.25);color:#fff}
.daycard .task,.daycard .task:first-child{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;margin-bottom:6px}
.daycard .task .btn{padding:2px 7px;font-size:12px}
.daysum{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:8px}
.wall{display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:center}
.wsvg{width:190px;height:190px;flex:0 0 auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
.winfo{flex:1 1 220px;min-width:0}
.wtime{font-size:34px;font-weight:800;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.wday{font-size:20px;font-weight:800;color:var(--accent)}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px;margin-top:8px;max-width:290px}
.mcal span{padding:2px 0;border-radius:6px}.mcal .now{background:var(--accent);color:#fff;font-weight:800}.mcal .fri{color:var(--bad)}
.rtd{font:inherit;font-size:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--muted);cursor:pointer;padding:0}
.rtd.on{background:var(--good);border-color:var(--good);color:#fff}.rtd.off{opacity:.3}.rtd.now{outline:2px solid var(--accent)}.rtd:disabled{cursor:default}
.rtw{display:flex;gap:5px;margin-top:6px}
@media(max-width:700px){header nav{overflow-x:auto;justify-content:flex-start}nav button{flex:1 0 54px}}
.wsvg{width:130px;height:130px}.wallmini{display:flex;justify-content:center;margin-bottom:12px}
</style>
</head>
<body>
<header><div class="wrap">
<h1>📚 ثبت و تحلیل مطالعه</h1>
<nav>
<button data-v="today" onclick="setView('today')"><span class="ic">⏱</span>امروز</button>
<button data-v="plan" onclick="setView('plan')"><span class="ic">📅</span>برنامه</button>
<button data-v="routine" onclick="setView('routine')"><span class="ic">🔄</span>روتین</button>
<button data-v="analysis" onclick="setView('analysis')"><span class="ic">📊</span>تحلیل</button>
<button data-v="exams" onclick="setView('exams')"><span class="ic">📝</span>آزمون</button>
<button data-v="mistakes" onclick="setView('mistakes')"><span class="ic">🎯</span>نقاط ضعف</button>
<button data-v="league" onclick="setView('league')"><span class="ic">🏆</span>رقابت</button>
<button data-v="history" onclick="setView('history')"><span class="ic">🗂</span>تاریخچه</button>
<button data-v="settings" onclick="setView('settings')"><span class="ic">⚙️</span>تنظیمات</button>
</nav></div></header>
<main id="app"></main>
<div class="alertbar" id="alertBar"></div>
<div class="overlay" id="overlay" onmousedown="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- تقویم جلالی ---------- */
function div(a,b){return ~~(a/b)}function mod(a,b){return a-~~(a/b)*b}
function jalCal(jy,withoutLeap){var br=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178],bl=br.length,gy=jy+621,leapJ=-14,jp=br[0],jm,jump,leap,leapG,march,n,i;
for(i=1;i<bl;i+=1){jm=br[i];jump=jm-jp;if(jy<jm)break;leapJ=leapJ+div(jump,33)*8+div(mod(jump,33),4);jp=jm}
n=jy-jp;leapJ=leapJ+div(n,33)*8+div(mod(n,33)+3,4);if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;if(withoutLeap)return{gy:gy,march:march};
if(jump-n<6)n=n-jump+div(jump+4,33)*33;leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;return{leap:leap,gy:gy,march:march}}
function g2d(gy,gm,gd){var d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;d=d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;return d}
function d2g(jdn){var j=4*jdn+139361631;j=j+div(div(4*jdn+183187720,146097)*3,4)*4-3908;var i=div(mod(j,1461),4)*5+308;var gd=div(mod(i,153),5)+1;var gm=mod(div(i,153),12)+1;var gy=div(j,1461)-100100+div(8-gm,6);return{gy:gy,gm:gm,gd:gd}}
function j2d(jy,jm,jd){var r=jalCal(jy,true);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1}
function d2j(jdn){var gy=d2g(jdn).gy,jy=gy-621,r=jalCal(jy,false),jdn1f=g2d(gy,3,r.march),jd,jm,k;k=jdn-jdn1f;
if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy:jy,jm:jm,jd:jd}}else k-=186}else{jy-=1;k+=179;if(r.leap===1)k+=1}
jm=7+div(k,30);jd=mod(k,30)+1;return{jy:jy,jm:jm,jd:jd}}
const jLen=(jy,jm)=>jm<=6?31:jm<=11?30:(jalCal(jy,false).leap===0?30:29);

/* ---------- ابزارهای عمومی ---------- */
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const WEEKDAYS=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
const FD='۰۱۲۳۴۵۶۷۸۹';
const pad=n=>String(n).padStart(2,'0');
const fa=x=>String(x);
const en=s=>String(s==null?'':s).replace(/[۰-۹]/g,d=>FD.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[٫،,]/g,'.');
const num=s=>{const v=parseFloat(en(s));return isNaN(v)?null:v};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const val=id=>{const e=$(id);return e?e.value:''};
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dateOf=k=>{const p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2],12)};
const todayKey=()=>keyOf(new Date());
const addDays=(k,n)=>{const d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d)};
const diffDays=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const wdIdx=k=>(dateOf(k).getDay()+1)%7; // شنبه = 0
const toJ=k=>{const d=dateOf(k);return d2j(g2d(d.getFullYear(),d.getMonth()+1,d.getDate()))};
const fromJ=(jy,jm,jd)=>{const g=d2g(j2d(jy,jm,jd));return g.gy+'-'+pad(g.gm)+'-'+pad(g.gd)};
const jDate=(k,short)=>{const j=toJ(k);return short?fa(j.jd)+' '+MONTHS[j.jm-1]:WEEKDAYS[wdIdx(k)]+' '+fa(j.jd)+' '+MONTHS[j.jm-1]+' '+fa(j.jy)};
function dur(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);if(!h&&!m)return sec>0?'کمتر از 1 دقیقه':'0 دقیقه';if(!h)return fa(m)+' دقیقه';if(!m)return fa(h)+' ساعت';return fa(h)+' ساعت و '+fa(m)+' دقیقه'}
const hm=sec=>{const h=Math.floor(sec/3600),m=Math.round(sec%3600/60);return h+m===0?'0':fa(h)+':'+fa(pad(m))};
const clock=ms=>{const t=Math.floor(ms/1000);return pad(Math.floor(t/3600))+':'+pad(Math.floor(t%3600/60))+':'+pad(t%60)};
const pctTxt=p=>p==null?'—':'\u2066'+(p<0?'−':'')+Math.abs(Math.round(p))+'%\u2069';

function rangeFor(id){const tk=todayKey();let from,to,label;const ws=k=>addDays(k,-wdIdx(k));
if(id==='today'){from=to=tk;label='امروز'}
else if(id==='yesterday'){from=to=addDays(tk,-1);label='دیروز'}
else if(id==='week'){from=ws(tk);to=addDays(from,6);label='هفته جاری'}
else if(id==='lastWeek'){from=addDays(ws(tk),-7);to=addDays(from,6);label='هفته گذشته'}
else if(id==='month'||id==='lastMonth'){let j=toJ(tk),jy=j.jy,jm=j.jm;if(id==='lastMonth'){jm--;if(jm<1){jm=12;jy--}}from=fromJ(jy,jm,1);to=fromJ(jy,jm,jLen(jy,jm));label=(id==='month'?'ماه جاری':'ماه گذشته')+' ('+MONTHS[jm-1]+')'}
else if(id==='last30'){to=tk;from=addDays(tk,-29);label='30 روز اخیر'}
else{from=allSess().reduce((m,s)=>s.date<m?s.date:m,tk);to=tk;label='کل دوره'}
const end=to>tk?tk:to;return{id,from,to,end,elapsed:Math.max(1,diffDays(from,end)+1),total:diffDays(from,to)+1,label}}

function delta(cur,prev){if(!prev)return'';const d=(cur-prev)/prev*100;if(!isFinite(d))return'';return`<span class="delta ${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${fa(Math.abs(Math.round(d)))}%</span>`}

function dailyChart(R,list){const by={};list.forEach(s=>by[s.date]=(by[s.date]||0)+(s.sec||0));const tk=todayKey();let cols=[],weekly=false;
if(R.total<=62){for(let i=0;i<R.total;i++){const k=addDays(R.from,i);cols.push({k,sec:by[k]||0,lbl:R.total<=7?WEEKDAYS[wdIdx(k)]:fa(toJ(k).jd),today:k===tk,future:k>tk})}}
else{weekly=true;let k=addDays(R.from,-wdIdx(R.from));while(k<=R.to){let sec=0;for(let i=0;i<7;i++)sec+=by[addDays(k,i)]||0;const j=toJ(k);cols.push({k,sec,lbl:fa(j.jd)+'/'+fa(j.jm)});k=addDays(k,7)}cols=cols.slice(-40)}
const goal=S.settings.dailyGoalMin*60,max=Math.max(...cols.map(c=>c.sec),weekly?1:goal,1);
const showV=cols.length<=15;
return`<div class="chart">${weekly?'':`<div class="goal" style="bottom:${goal/max*100}%" title="هدف روزانه"></div>`}${cols.map(c=>`<div class="col ${c.today?'today':''} ${c.future?'future':''}" title="${jDate(c.k,true)}: ${dur(c.sec)}">${showV&&c.sec?`<div class="v">${hm(c.sec)}</div>`:''}<div class="bar" style="height:${c.sec?Math.max(2,c.sec/max*(100-(showV?10:0))):0}%"></div></div>`).join('')}</div>
<div class="lbls">${cols.map(c=>`<div>${c.lbl}</div>`).join('')}</div>${weekly?'<div class="muted small">هر ستون = یک هفته (از شنبه)</div>':'<div class="muted small">خط نارنجی = هدف روزانه</div>'}`}

function weekdayChart(R,list){const sum=Array(7).fill(0),cnt=Array(7).fill(0);for(let i=0;i<R.elapsed;i++)cnt[wdIdx(addDays(R.from,i))]++;list.forEach(s=>sum[wdIdx(s.date)]+=s.sec||0);
const avg=sum.map((x,i)=>cnt[i]?x/cnt[i]:0),max=Math.max(...avg,1);
return`<div class="chart" style="height:130px">${avg.map((v,i)=>`<div class="col" title="${WEEKDAYS[i]}: ${dur(v)}">${v?`<div class="v">${hm(v)}</div>`:''}<div class="bar" style="height:${v?Math.max(2,v/max*85):0}%"></div></div>`).join('')}</div><div class="lbls">${WEEKDAYS.map(w=>`<div>${w}</div>`).join('')}</div>`}

function heatmap(){const tk=todayKey(),goal=S.settings.dailyGoalMin*60,by={};allSess().forEach(s=>by[s.date]=(by[s.date]||0)+(s.sec||0));
const start=addDays(addDays(tk,-wdIdx(tk)),-77);let h='';
for(let i=0;i<84;i++){const k=addDays(start,i);if(k>tk){h+='<i style="visibility:hidden"></i>';continue}const sec=by[k]||0,r=goal?sec/goal:0;const l=!sec?'':r<.25?'l1':r<.5?'l2':r<.75?'l3':r<1?'l4':'l5';h+=`<i class="${l}" title="${jDate(k,true)}: ${dur(sec)}"></i>`}
return`<div class="heat">${h}</div><div class="legend">کم <i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><i class="l5"></i> رسیدن به هدف روزانه</div>`}

const SORTERS={time:(a,b)=>b.sec-a.sec,timeAsc:(a,b)=>a.sec-b.sec,tests:(a,b)=>b.tests-a.tests,pctAsc:(a,b)=>(a.pct==null?999:a.pct)-(b.pct==null?999:b.pct),pctDesc:(a,b)=>(b.pct==null?-999:b.pct)-(a.pct==null?-999:a.pct),old:(a,b)=>a.allLast.localeCompare(b.allLast)};

function insights(R,list,a,topics,bySub){const out=[],add=(k,t)=>out.push({k,t}),tk=todayKey();
if(!list.length){add('info','در این بازه چیزی ثبت نشده.');return out}
const subs=[...bySub.entries()].sort((x,y)=>y[1].sec-x[1].sec);
if(a.sec>0)add('good',`بیشترین زمان مطالعه: ${subs[0][0]} با ${dur(subs[0][1].sec)} (${fa(Math.round(subs[0][1].sec/a.sec*100))}% کل زمان).`);
if(R.elapsed>=3){const names=S.settings.subjects.map(s=>s.name).filter(n=>n!=='سایر'),zero=names.filter(n=>!(bySub.get(n)&&bySub.get(n).sec>0));
if(zero.length)add('bad',`برای ${zero.join('، ')} در این بازه هیچ مطالعه‌ای ثبت نشده.`);
else{const least=names.map(n=>[n,bySub.get(n).sec]).sort((x,y)=>x[1]-y[1])[0];add('info',`کم‌مطالعه‌ترین درس: ${least[0]} (${dur(least[1])}).`)}
S.settings.subjects.filter(s=>s.goalH>0).forEach(s=>{const exp=s.goalH*3600*R.elapsed/7,act=(bySub.get(s.name)||{sec:0}).sec,p=act/exp*100;
if(p<60)add('bad',`${s.name}: فقط ${fa(Math.round(p))}% از هدفت (${fa(s.goalH)} ساعت در هفته) انجام شده.`);else if(p>=100)add('good',`${s.name}: به هدف هفتگی رسیدی (${fa(Math.round(p))}%).`)})}
const tp=topics.filter(t=>t.gTests>=10&&t.pct!=null).sort((x,y)=>x.pct-y.pct);
if(tp.length>=2){add('bad',`ضعیف‌ترین مبحث از نظر درصد: ${tp[0].name} (${tp[0].subject}) با ${pctTxt(tp[0].pct)} در ${fa(tp[0].gTests)} تست.`);add('good',`قوی‌ترین مبحث: ${tp[tp.length-1].name} (${tp[tp.length-1].subject}) با ${pctTxt(tp[tp.length-1].pct)}.`)}
else if(tp.length===1)add('info',`مبحث ${tp[0].name} درصد ${pctTxt(tp[0].pct)} داره. (برای مقایسه‌ی بهتر، تست‌های بیشتری با تعداد درست و غلط ثبت کن)`);
const sp=subs.filter(([n,v])=>v.gTests>=10&&v.pct!=null).sort((x,y)=>x[1].pct-y[1].pct);
if(sp.length>=2)add('info',`درصد درس‌ها: ضعیف‌ترین ${sp[0][0]} (${pctTxt(sp[0][1].pct)})، قوی‌ترین ${sp[sp.length-1][0]} (${pctTxt(sp[sp.length-1][1].pct)}).`);
const sorted=[...topics].sort((x,y)=>x.sec-y.sec),median=sorted.length?sorted[Math.floor(sorted.length/2)].sec:0;
topics.filter(t=>t.gTests>=10&&t.pct!=null&&t.pct<30&&t.sec>median&&t.sec>=3600).slice(0,2).forEach(t=>add('bad',`روی «${t.name}» (${t.subject}) وقت زیادی گذاشتی (${dur(t.sec)}) ولی درصد پایینه (${pctTxt(t.pct)}). شاید روش مطالعه یا منبع رو باید عوض کنی.`));
if(R.elapsed>=14){const sum=Array(7).fill(0),cnt=Array(7).fill(0);for(let i=0;i<R.elapsed;i++)cnt[wdIdx(addDays(R.from,i))]++;list.forEach(s=>sum[wdIdx(s.date)]+=s.sec||0);
const av=sum.map((x,i)=>cnt[i]?[i,x/cnt[i]]:null).filter(Boolean).sort((x,y)=>y[1]-x[1]);if(av.length>=2)add('info',`پرکارترین روز هفته: ${WEEKDAYS[av[0][0]]} (میانگین ${dur(av[0][1])}) — کم‌کارترین: ${WEEKDAYS[av[av.length-1][0]]} (${dur(av[av.length-1][1])}).`)}
if(R.elapsed>=3){const p=a.days.size/R.elapsed*100;add(p>=80?'good':p<50?'bad':'info',`در ${fa(a.days.size)} روز از ${fa(R.elapsed)} روز مطالعه ثبت کردی (${fa(Math.round(p))}%).`)}
const st=streaks();if(st.cur>=2)add('good',`ردیف روزهای متوالی: ${fa(st.cur)} روز (بهترین رکورد: ${fa(st.best)} روز).`);
const old=[...groupAgg(S.sessions,s=>s.subject+'||'+topicOf(s)).entries()].map(([k,v])=>({n:k.split('||')[1],s:k.split('||')[0],last:v.last})).filter(x=>diffDays(x.last,tk)>=10&&x.n!=='(بدون مبحث)').sort((x,y)=>x.last.localeCompare(y.last)).slice(0,5);
if(old.length)add('bad',`مباحثی که مدتیه مرور نکردی: ${old.map(x=>x.n+' ('+fa(diffDays(x.last,tk))+' روز پیش)').join('، ')}.`);
return out}

let EX_SUBS=['ریاضی','فیزیک','شیمی'];
function syncEx(){const l=S.settings.examSubjects;EX_SUBS=(Array.isArray(l)&&l.length?l:['ریاضی','فیزیک','شیمی']).slice()}
const f2=x=>(Math.round(x*100)/100).toFixed(2);
const exPct=(t,c,w)=>t>0?((c||0)-(w||0)/3)/t*100:null;
function exTotals(e){const co=S.settings.examCoef||{};let T=0,C=0,W=0,ws=0,wsum=0;
EX_SUBS.forEach(n=>{const x=(e.subs&&e.subs[n])||{},t=x.total||0;if(t>0){T+=t;C+=x.correct||0;W+=x.wrong||0;const k=co[n]||1;ws+=exPct(t,x.correct,x.wrong)*k;wsum+=k}});
return{T,C,W,pooled:T>0?exPct(T,C,W):null,weighted:wsum>0?ws/wsum:null}}
function newDraft(){const subs={};EX_SUBS.forEach(n=>subs[n]={total:'',correct:'',wrong:''});return{editId:null,date:todayKey(),name:'',subs,examSec:0,analysisSec:0,analysisLog:[],note:''}}
function exDraft(){if(!S.examDraft)S.examDraft=newDraft();return S.examDraft}
const exEl=k=>{const t=S.examTimers[k];return t.accumMs+(t.status==='running'?Date.now()-t.startedAt:0)};
function resetTitle(){const r=S.timer.status==='running'||S.examTimers.exam.status==='running'||S.examTimers.analysis.status==='running';if(!r)document.title='ثبت و تحلیل مطالعه'}

function etStart(k){unlockAudio();const t=S.examTimers[k];t.status='running';t.startedAt=Date.now();save();render()}
function etPause(k){const t=S.examTimers[k];if(t.status==='running'){t.accumMs=exEl(k);t.status='paused';t.startedAt=0;save()}resetTitle();render()}
function etReset(k){if(exEl(k)>5000&&!confirm('تایمر بدون ثبت پاک بشه؟'))return;Object.assign(S.examTimers[k],{status:'idle',startedAt:0,accumMs:0,alerted:false});save();resetTitle();render()}
function etCommit(k){const t=S.examTimers[k],sec=Math.round(exEl(k)/1000);if(sec<1){toast('هنوز زمانی ثبت نشده');return}
if(k==='exam')exDraft().examSec+=sec;
else{const e=t.target&&t.target!=='draft'?S.exams.find(x=>x.id===t.target):null;if(e){e.analysisSec=(e.analysisSec||0)+sec;(e.analysisLog=e.analysisLog||[]).push({date:todayKey(),sec})}else{const d=exDraft();d.analysisSec+=sec;(d.analysisLog=d.analysisLog||[]).push({date:todayKey(),sec})}}
Object.assign(t,{status:'idle',startedAt:0,accumMs:0,alerted:false});save();resetTitle();render();toast('زمان ثبت شد ✓')}

function exTime(f,v){const d=exDraft();d[f]=Math.max(0,Math.round((num(v)||0)*60));if(f==='analysisSec'){const ls=(d.analysisLog||[]).reduce((a,l)=>a+l.sec,0);if(d.analysisSec<ls)d.analysisLog=[]}save()}
function exCalc(){const d=exDraft(),tmp={subs:{}};
EX_SUBS.forEach((n,i)=>{const t=num(val('e_t'+i)),c=num(val('e_c'+i)),w=num(val('e_w'+i));
d.subs[n]={total:t==null?'':t,correct:c==null?'':c,wrong:w==null?'':w};
const T=t||0,C=c||0,W=w||0,blank=T-C-W,bad=blank<0||T<0;tmp.subs[n]=bad?{total:0,correct:0,wrong:0}:{total:T,correct:C,wrong:W};
$('e_b'+i).textContent=T>0||C||W?(bad?'⚠':fa(blank)):'—';
const p=bad||T<=0?null:exPct(T,C,W),pe=$('e_p'+i);pe.textContent=bad?'⚠ بیشتر از تعداد سوال':pctX(p);pe.className=pctCls(p)});
const tt=exTotals(tmp);$('e_tp').textContent=pctX(tt.pooled);$('e_tp').className=pctCls(tt.pooled);$('e_tw').textContent=pctX(tt.weighted);$('e_tw').className=pctCls(tt.weighted);
$('e_ts').textContent=tt.T?fa(tt.T)+' / '+fa(tt.C)+' / '+fa(tt.W):'—';save()}
function hasDraftData(d){return d.name||d.note||d.examSec||d.analysisSec||EX_SUBS.some(n=>d.subs[n].total!==''||d.subs[n].correct!==''||d.subs[n].wrong!=='')}
function exSave(){const d=exDraft();exCalc();
if(d.date>todayKey()){toast('تاریخ آینده قابل ثبت نیست');return}
const subs={};let any=false;
for(const n of EX_SUBS){const x=d.subs[n],t=x.total===''?0:x.total,c=x.correct===''?0:x.correct,w=x.wrong===''?0:x.wrong;
if(t<0||c<0||w<0||c+w>t){toast('در '+n+' تعداد درست و غلط از تعداد سوال بیشتره');return}
if(t>0)any=true;subs[n]={total:t,correct:c,wrong:w}}
if(!any){toast('حداقل برای یک درس تعداد سوال رو وارد کن');return}
const o={date:d.date,name:(d.name||'').trim(),subs,examSec:d.examSec||0,analysisSec:d.analysisSec||0,analysisLog:(d.analysisLog||[]).slice(),note:(d.note||'').trim()};
if(d.editId){const e=S.exams.find(x=>x.id===d.editId);if(e)Object.assign(e,o);else S.exams.push(Object.assign({id:uid(),ts:Date.now()},o))}
else S.exams.push(Object.assign({id:uid(),ts:Date.now()},o));
S.examDraft=null;save();render();toast('آزمون ثبت شد ✓')}
function exCancel(){const d=exDraft();if(hasDraftData(d)&&!confirm('اطلاعات فرم پاک بشه؟'))return;S.examDraft=null;save();render()}
function exEdit(id){const e=S.exams.find(x=>x.id===id);if(!e)return;const cur=S.examDraft;
if(cur&&!cur.editId&&hasDraftData(cur)&&!confirm('اطلاعات فرم فعلی پاک بشه و این آزمون برای ویرایش باز بشه؟'))return;
S.examDraft={editId:id,date:e.date,name:e.name||'',subs:JSON.parse(JSON.stringify(e.subs)),examSec:e.examSec||0,analysisSec:e.analysisSec||0,analysisLog:(e.analysisLog||[]).slice(),note:e.note||''};
save();render();window.scrollTo(0,0)}

return`<section class="card" style="margin-top:14px"><h2>${d.editId?'✏️ ویرایش آزمون':'📝 ثبت آزمون'}</h2>

<div class="grid" style="margin-top:10px"><div class="kpi"><b id="e_tp">—</b><span>درصد کل (همه‌ی سوال‌ها با هم)</span></div><div class="kpi"><b id="e_tw">—</b><span>درصد کل با ضریب (${EX_SUBS.map(n=>n+' '+fa(co[n]||1)).join('، ')})</span></div><div class="kpi"><b id="e_ts">—</b><span>سوال / درست / غلط</span></div></div>

<div class="muted small">با «پایان و ثبت زمان» توی تایمرهای بالا، این دو خونه خودکار پر می‌شن.</div>

<div class="row fit" style="margin-top:12px"><button class="btn" onclick="exSave()">${d.editId?'ذخیره‌ی تغییرات':'ثبت آزمون'}</button><button class="btn ghost" onclick="exCancel()">${d.editId?'انصراف از ویرایش':'پاک کردن فرم'}</button></div></section>`}

/* تحلیل آزمون‌ها */
function exChart(rows){rows=rows.slice(-20);const W=420,H=260,pl=10,pr=34,pt=14,pb=26,n=rows.length;
const series=[...EX_SUBS.map((s,i)=>({name:s,color:subjColor(s),w:2,vals:rows.map(r=>r.p[i])})),{name:'درصد کل',color:'var(--text)',w:3.5,vals:rows.map(r=>r.t.pooled)}];
const all=series.flatMap(s=>s.vals).filter(v=>v!=null);
const mn=Math.min(0,Math.floor(Math.min(...all)/10)*10),mx=Math.max(10,Math.ceil(Math.max(...all)/10)*10);
const y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb),x=i=>n>1?W-pr-i*((W-pl-pr)/(n-1)):(W-pr+pl)/2;
let g='';for(let k=0;k<=5;k++){const v=mn+k*(mx-mn)/5;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--line)"/><text x="${W-pr+6}" y="${y(v)+4}" font-size="12" fill="currentColor">${fa(Math.round(v))}</text>`}
if(mn<0)g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" style="stroke:var(--muted)" stroke-dasharray="4 3"/>`;
let lines='';series.forEach(s=>{let d='',pen=false;s.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true});
lines+=`<path d="${d}" fill="none" stroke-width="${s.w}" stroke-linejoin="round" style="stroke:${s.color}"/>`;
s.vals.forEach((v,i)=>{if(v!=null)lines+=`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${s.w>3?4:3}" style="fill:${s.color}"><title>${s.name} – ${jDate(rows[i].e.date,true)}: ${pctX(v)}</title></circle>`})});
let xl='';rows.forEach((r,i)=>{if(n>7&&i%2)return;const j=toJ(r.e.date);xl+=`<text x="${x(i)}" y="${H-8}" font-size="12" text-anchor="middle" fill="currentColor">${fa(j.jd)}/${fa(j.jm)}</text>`});
return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;color:var(--muted);direction:ltr">${g}${lines}${xl}</svg>
<div class="legend" style="flex-wrap:wrap;gap:10px">${series.map(s=>`<span><i style="background:${s.color};border:0;width:14px;height:5px;border-radius:3px;vertical-align:middle"></i> ${s.name}</span>`).join('')}</div>`}
function exAnalysis(){const ex=S.exams.slice().sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
if(!ex.length)return`<section class="card"><h2>📊 تحلیل آزمون‌ها</h2><div class="empty">بعد از ثبت اولین آزمون، تحلیل‌ها اینجا نشون داده می‌شن.</div></section>`;
const rows=ex.map(e=>({e,t:exTotals(e),p:EX_SUBS.map(n=>{const x=e.subs[n];return x&&x.total>0?exPct(x.total,x.correct,x.wrong):null})}));
const last=rows[rows.length-1],prev=rows.length>1?rows[rows.length-2]:null,pooled=rows.map(r=>r.t.pooled).filter(v=>v!=null);
const avgP=pooled.reduce((a,b)=>a+b,0)/pooled.length,bestR=rows.reduce((m,r)=>(!m||r.t.pooled>m.t.pooled)?r:m,null);
const dl=(a,b)=>{if(a==null||b==null)return'';const d=a-b;if(Math.abs(d)<.05)return'';return`<span class="delta ${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${f2(Math.abs(d))}</span>`};
const subStats=EX_SUBS.map((n,i)=>{const ps=rows.map(r=>r.p[i]).filter(v=>v!=null);let T=0,C=0,W=0;ex.forEach(e=>{const x=e.subs[n];if(x){T+=x.total||0;C+=x.correct||0;W+=x.wrong||0}});
return{n,i,avg:ps.length?ps.reduce((a,b)=>a+b,0)/ps.length:null,lastP:last.p[i],prevP:prev?prev.p[i]:null,best:ps.length?Math.max(...ps):null,worst:ps.length?Math.min(...ps):null,blank:T?(T-C-W)/T*100:null,acc:C+W?C/(C+W)*100:null,T,C,W}});
const sumEx=ex.reduce((a,e)=>a+(e.examSec||0),0),sumAn=ex.reduce((a,e)=>a+(e.analysisSec||0),0);
const ins=[],add=(k,t)=>ins.push({k,t}),rk=subStats.filter(s=>s.avg!=null).sort((a,b)=>b.avg-a.avg);
if(rk.length>=2){add('good',`بهترین درس: ${rk[0].n} (میانگین ${pctX(rk[0].avg)}).`);add('bad',`ضعیف‌ترین درس: ${rk[rk.length-1].n} (میانگین ${pctX(rk[rk.length-1].avg)}).`)}
if(prev&&last.t.pooled!=null&&prev.t.pooled!=null){const d=last.t.pooled-prev.t.pooled;add(d>=0?'good':'bad',`درصد کل آخرین آزمون ${f2(Math.abs(d))} امتیاز ${d>=0?'بالاتر':'پایین‌تر'} از آزمون قبلیه.`)}

let planWeek=null,editingTask=null;
const planSubjects=()=>[...S.settings.subjects.map(x=>x.name),'آزمون','تحلیل آزمون'];
function planActuals(date){const tasks=S.plan.filter(t=>t.date===date).sort((a,b)=>(a.ts||0)-(b.ts||0)),res=new Map();if(!tasks.length)return res;
const sess=allSess().filter(x=>x.date===date),by={};tasks.forEach(t=>(by[t.subject]=by[t.subject]||[]).push(t));
const sum=(l,f)=>l.reduce((a,x)=>a+(x[f]||0),0);
for(const sub in by){const ss=sess.filter(x=>x.subject===sub),tt=by[sub];
const withT=tt.filter(t=>t.topic&&t.topic.trim()),gen=tt.filter(t=>!(t.topic&&t.topic.trim()));
withT.forEach(t=>{const m=ss.filter(x=>(x.topic||'').trim()===t.topic.trim());res.set(t.id,{sec:sum(m,'sec'),tests:sum(m,'tests')})});
const used=ss.filter(x=>withT.some(t=>(x.topic||'').trim()===t.topic.trim()));
let rs=Math.max(0,sum(ss,'sec')-sum(used,'sec')),rt=Math.max(0,sum(ss,'tests')-sum(used,'tests'));
gen.forEach((t,i)=>{const last=i===gen.length-1,ts=(t.min||0)*60,tc=t.tests||0;
const sec=last?rs:Math.min(rs,ts>0?ts:rs),te=last?rt:Math.min(rt,tc>0?tc:rt);rs-=sec;rt-=te;res.set(t.id,{sec,tests:te})})}
return res}
function taskState(t,a){a=a||{sec:0,tests:0};const items=[];if(t.min>0)items.push(a.sec/(t.min*60));if(t.tests>0)items.push(a.tests/t.tests);
const pct=items.length?Math.min(100,items.reduce((x,y)=>x+Math.min(1,y),0)/items.length*100):null;
return{pct,done:!!t.done||(items.length>0&&items.every(x=>x>=1)),a}}
function taskRow(t,a){const st=taskState(t,a),parts=[];
if(t.min>0)parts.push(dur(st.a.sec)+' از '+dur(t.min*60));else if(st.a.sec>0)parts.push(dur(st.a.sec));
if(t.tests>0)parts.push(fa(st.a.tests)+' از '+fa(t.tests)+' تست');else if(st.a.tests>0)parts.push(fa(st.a.tests)+' تست');
return`<div class="task ${st.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} title="تیک دستی" onchange="toggleTask('${t.id}',this.checked)"><div class="body"><div class="ttl"><i class="dot" style="background:${subjColor(t.subject)}"></i><b>${esc(t.subject)}</b>${t.topic?' – '+esc(t.topic):''}${st.done&&!t.done?' <span class="tag">خودکار ✓</span>':''}</div>${parts.length?`<div class="small muted">${parts.join(' · ')}</div>`:''}${st.pct!=null?`<div class="mini"><i class="${st.pct>=100?'full':''}" style="width:${st.pct}%"></i></div>`:''}${t.note?`<div class="small muted">📝 ${esc(t.note)}</div>`:''}</div><div class="act"><button class="btn ghost sm" title="ویرایش" onclick="openTask({id:'${t.id}'})">✏️</button><button class="btn ghost sm" title="حذف" onclick="delTask('${t.id}')">🗑</button></div></div>`}

const ws=planWeek,we=addDays(ws,6),days=[...Array(7)].map((_,i)=>addDays(ws,i)),tasks=S.plan.filter(t=>t.date>=ws&&t.date<=we);
const acts={};days.forEach(d=>acts[d]=planActuals(d));

else{m.stage=0;m.next=addDays(tk,1)}

const RTD=['ش','ی','د','س','چ','پ','ج'],ALLD=[0,1,2,3,4,5,6];

const lst=`<section class="card"><h2>همه‌ی روتین‌ها</h2>${S.routine.items.length?`<div class="muted small">درصد انجام این هفته: <b class="${pctCls(sc?dn/sc*100:null)}">${sc?Math.round(dn/sc*100)+'%':'—'}</b> (${fa(dn)} از ${fa(sc)})</div>`:''}

<div class="rtw">${ALLD.map(i=>{const k=addDays(ws,i),on=rtDays(r).includes(i);return`<button class="rtd ${on?'':'off'} ${rtDone(k,r.id)?'on':''} ${k===tk?'now':''}" ${!on||k>tk?'disabled':''} title="${jDate(k,true)}" onclick="rtToggle('${k}','${r.id}')">${RTD[i]}</button>`}).join('')}</div>

async function sbReq(path,method,body,tok,extra){const h=Object.assign({apikey:SB_KEY,'Content-Type':'application/json'},extra||{});if(tok)h.Authorization='Bearer '+tok;
const r=await fetch(SB_URL+path,{method,headers:h,body:body?JSON.stringify(body):undefined});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(e){}
if(!r.ok)throw new Error((j&&(j.msg||j.error_description||j.message||j.error))||('HTTP '+r.status));return j}
function setAuth(j){AUTH={access_token:j.access_token,refresh_token:j.refresh_token,expires_at:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),user:{id:j.user.id,email:j.user.email,username:(j.user.user_metadata||{}).username||''}};localStorage.setItem('st.auth',JSON.stringify(AUTH))}

/* ======================= رقابت گروهی (Supabase) ======================= */
const LG_SQL=`create table if not exists public.study_stats (
  grp text not null,
  uid text not null,
  nick text not null,
  day date not null,
  min_timed int not null default 0,
  min_all int not null default 0,
  tests int not null default 0,
  updated_at timestamptz not null default now(),
  primary key (grp, uid, day)
);
alter table public.study_stats enable row level security;
revoke all on public.study_stats from anon, authenticated;

create or replace function public.submit_stats(p_grp text, p_uid text, p_nick text, p_rows jsonb)
returns void language plpgsql security definer set search_path = public as $$
declare r jsonb;
begin
  if length(p_grp) < 6 or length(p_grp) > 64 or length(p_uid) < 8 or length(p_uid) > 64 then
    raise exception 'bad input';
  end if;
  if jsonb_array_length(p_rows) > 60 then raise exception 'too many rows'; end if;
  for r in select * from jsonb_array_elements(p_rows) loop
    insert into public.study_stats (grp, uid, nick, day, min_timed, min_all, tests, updated_at)
    values (p_grp, p_uid, left(p_nick, 30), (r->>'day')::date,
            least(greatest((r->>'t')::int, 0), 1440),
            least(greatest((r->>'a')::int, 0), 1440),
            least(greatest((r->>'q')::int, 0), 2000), now())
    on conflict (grp, uid, day) do update
      set nick = excluded.nick, min_timed = excluded.min_timed, min_all = excluded.min_all,
          tests = excluded.tests, updated_at = now();
  end loop;
end $$;

create or replace function public.get_board(p_grp text, p_from date, p_to date)
returns table (member text, nick text, min_timed bigint, min_all bigint, tests bigint, days bigint)
language sql security definer set search_path = public as $$
  select s.uid,
         (array_agg(s.nick order by s.updated_at desc))[1],
         sum(s.min_timed)::bigint, sum(s.min_all)::bigint, sum(s.tests)::bigint,
         (count(*) filter (where s.min_all > 0))::bigint
  from public.study_stats s
  where s.grp = p_grp and length(p_grp) >= 6 and s.day between p_from and p_to
  group by s.uid;
$$;

grant execute on function public.submit_stats(text, text, text, jsonb) to anon;
grant execute on function public.get_board(text, date, date) to anon;
notify pgrst, 'reload schema';`;

let lg={range:'week',timed:true,board:null,busy:false,err:'',at:0,sig:'',sql:false};
const lgCfg=()=>{const g=S.settings.group;return g&&g.url&&g.key&&g.code&&g.uid&&g.nick?g:null};
const lgNewUid=()=>(window.crypto&&crypto.randomUUID?crypto.randomUUID():'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
function lgHeaders(g){const h={'Content-Type':'application/json',apikey:g.key};if(/^eyJ/.test(g.key))h.Authorization='Bearer '+g.key;return h}
async function lgRpc(g,fn,body){const r=await fetch(g.url.replace(/\/+$/,'')+'/rest/v1/rpc/'+fn,{method:'POST',headers:lgHeaders(g),body:JSON.stringify(body)});
if(!r.ok){let t='';try{t=await r.text()}catch(e){}throw new Error(r.status+' '+t.slice(0,300))}
const tx=await r.text();return tx?JSON.parse(tx):null}
function lgErr(e){const m=String((e&&e.message)||e);
if(/Failed to fetch|NetworkError|Load failed/i.test(m))return'به Supabase وصل نشد. اینترنت یا فیلترشکن رو چک کن و آدرس پروژه رو هم دوباره نگاه کن.';
if(/404|PGRST202|Could not find the function/i.test(m))return'تابع‌های دیتابیس پیدا نشد. مرحله‌ی SQL رو (کامل) اجرا کردی؟';
if(/401|403|Invalid API key|JWT/i.test(m))return'کلید (API key) درست نیست. کلید anon یا publishable رو بذار، نه service_role.';
if(/bad input/i.test(m))return'کد گروه خیلی کوتاهه (حداقل 6 حرف).';
return'خطا: '+m.slice(0,160)}
function lgRows(){const tk=todayKey(),all=allSess(),rows=[];
for(let i=34;i>=0;i--){const d=addDays(tk,-i);let t=0,a=0,q=0;
for(const s of all){if(s.date!==d)continue;const m=s.sec||0;a+=m;if(s.source==='timer'||s.source==='exam')t+=m;q+=s.tests||0}
rows.push({day:d,t:Math.round(t/60),a:Math.round(a/60),q})}
return rows}
async function lgSync(force){const g=lgCfg();if(!g)return false;const rows=lgRows(),sig=JSON.stringify(rows)+'|'+g.nick;if(!force&&sig===lg.sig)return true;
await lgRpc(g,'submit_stats',{p_grp:g.code,p_uid:g.uid,p_nick:g.nick,p_rows:rows});lg.sig=sig;lg.at=Date.now();return true}
function lgRange(){const tk=todayKey();
if(lg.range==='day')return[tk,tk,'امروز'];
if(lg.range==='week')return[addDays(tk,-wdIdx(tk)),tk,'این هفته (از شنبه)'];
return[addDays(tk,-29),tk,'30 روز اخیر']}
async function lgRefresh(force){const g=lgCfg();if(!g||lg.busy)return;lg.busy=true;lg.err='';if(view==='league')render();
try{await lgSync(force);const r=lgRange();lg.board=await lgRpc(g,'get_board',{p_grp:g.code,p_from:r[0],p_to:r[1]})}catch(e){lg.err=lgErr(e)}
lg.busy=false;if(view==='league')render()}
function lgSet(k,v){lg[k]=v;if(k==='timed')render();else lgRefresh(false)}
function lgInviteCode(g){return'ST1:'+btoa(unescape(encodeURIComponent(JSON.stringify({u:g.url,k:g.key,c:g.code}))))}
function lgDecode(t){try{t=String(t).trim();if(t.indexOf('ST1:')!==0)return null;const o=JSON.parse(decodeURIComponent(escape(atob(t.slice(4)))));return o&&o.u&&o.k&&o.c?o:null}catch(e){return null}}
function lgCopy(t,msg){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast(msg||'کپی شد ✓'),()=>prompt('این متن رو کپی کن:',t))}else prompt('این متن رو کپی کن:',t)}
function lgCleanUrl(u){try{const x=new URL(String(u).trim());if(x.protocol!=='https:'||!/\.supabase\.co$/i.test(x.hostname))return'';return x.origin}catch(e){return''}}
async function lgConnect(mode){let url,key,code,nick;
if(mode==='invite'){const d=lgDecode(val('lgInvite'));if(!d){toast('کد دعوت درست نیست');return}url=d.u;key=d.k;code=d.c;nick=val('lgNickI').trim()}
else{url=val('lgUrl');key=val('lgKey').trim();code=val('lgCode').trim();nick=val('lgNickN').trim()}
url=lgCleanUrl(url);
if(!url){toast('آدرس پروژه باید مثل https://xxxx.supabase.co باشه');return}
if(key.length<20){toast('کلید کامل نیست');return}
if(/service_role/i.test(key)){toast('کلید service_role رو هیچ‌جا وارد نکن!');return}
if(code.length<6){toast('کد گروه حداقل 6 حرف باشه');return}
if(nick.length<2||nick.length>20){toast('اسم مستعار 2 تا 20 حرف باشه');return}
const old=S.settings.group,g={url,key,code,nick,uid:(old&&old.uid)||lgNewUid(),auto:true};
lg.busy=true;lg.err='';render();
try{const tk=todayKey();await lgRpc(g,'get_board',{p_grp:code,p_from:tk,p_to:tk});S.settings.group=g;save();lg.sig='';lg.busy=false;await lgRefresh(true);toast('وصل شدی ✓')}
catch(e){lg.busy=false;lg.err=lgErr(e);render()}}
function lgRename(){const n=val('lgRen').trim(),g=S.settings.group;if(!g)return;if(n.length<2||n.length>20){toast('اسم مستعار 2 تا 20 حرف باشه');return}g.nick=n;save();lgRefresh(true)}
function lgLeave(){if(!confirm('از گروه خارج بشی؟ اطلاعات برنامه‌ات پاک نمی‌شه.'))return;delete S.settings.group;lg.board=null;lg.sig='';save();render()}
